    const langBtn = document.getElementById("lang-btn");
    const langMenu = document.getElementById("lang-menu");
    const langCurrent = document.getElementById("lang-current");

    function applyLang(lang) {
      const pack = COPY[lang] || COPY.en;
      const code = COPY[lang] ? lang : "en";
      document.documentElement.lang = code;
      document.title = "Meridian Flow Network — " + pack[PAGE + "Title"].replace(/&amp;/g, "&");
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        if (pack[el.dataset.i18n]) el.textContent = pack[el.dataset.i18n];
      });
      document.getElementById("policy").innerHTML =
        `<p class="kicker">${pack[PAGE + "Kicker"]}</p>` +
        `<h1>${pack[PAGE + "Title"]}</h1>` +
        `<p class="updated">${pack.updated}</p>` +
        pack[PAGE + "Html"];
      langCurrent.textContent = LANGS[code];
      langMenu.querySelectorAll("[data-lang]").forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.lang === code ? "true" : "false");
      });
      try { localStorage.setItem("mfn-lang", code); } catch (err) { /* ignore */ }
      const url = new URL(window.location.href);
      url.searchParams.set("lang", code);
      history.replaceState({}, "", url);
    }

    function closeLang() {
      langMenu.hidden = true;
      langBtn.setAttribute("aria-expanded", "false");
    }
    langBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = langMenu.hidden;
      langMenu.hidden = !open;
      langBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    langMenu.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-lang]");
      if (!btn) return;
      applyLang(btn.dataset.lang);
      closeLang();
    });
    document.addEventListener("click", closeLang);

    const params = new URLSearchParams(location.search);
    let initial = params.get("lang");
    if (!initial) {
      try { initial = localStorage.getItem("mfn-lang"); } catch (err) { initial = "en"; }
    }
    applyLang(initial || "en");
  </script>
