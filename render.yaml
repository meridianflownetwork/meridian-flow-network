# Render Blueprint — FastAPI desk (repo root, Python native runtime)
# Dashboard → New → Blueprint → meridian-flow-network

services:
  - type: web
    name: meridian-ops-desk
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run_dashboard.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: DASHBOARD_USER
        value: meridian
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: OPERATOR_EMAIL
        value: eli.mulla@meridianflownetwork.com
      - key: OPERATOR_PASSWORD
        sync: false
      - key: PORTAL_DEFAULT_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_LOOKUP_KEY
        value: retainer_monthly
      - key: STRIPE_RETAINER_PRICE_ID
        sync: false
      - key: RETAINER_ACCESS_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.eu
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hello@meridianflownetwork.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEFAULT_SENDER
        value: hello@meridianflownetwork.com
      - key: ZOHO_USER
        sync: false
      - key: ZOHO_PASS
        sync: false
      - key: REQUEST_ACCESS_TO
        value: hello@meridianflownetwork.com
