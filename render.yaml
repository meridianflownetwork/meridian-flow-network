services:
  - type: web
    name: meridian-ops-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_dashboard.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DASHBOARD_USER
        value: meridian
      - key: DASHBOARD_PASSWORD
        generateValue: true

  - type: cron
    name: meridian-pipeline
    runtime: python
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_scheduled_pipeline.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PIPELINE_MOCK
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
